# yaml-language-server: $schema=https://raw.githubusercontent.com/SchemaStore/schemastore/master/src/schemas/json/github-workflow.json
# Repo-owned CI jobs; ci.yaml calls this after lint, and release.yaml calls it for the release build. See https://github.com/anthony-spruyt/repo-operator/blob/main/docs/ci.md

name: CI (repo)

on:
  workflow_call:
    outputs:
      version:
        description: The project version from CMakeLists.txt
        value: ${{ jobs.build.outputs.version }}

permissions: {}

jobs:
  changes:
    name: Classify the pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      data_only: ${{ steps.classify.outputs.data_only }}
      boot_test: ${{ steps.classify.outputs.boot_test }}
    steps:
      - name: Check out the merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Classify with the base commit's classifier
        id: classify
        run: |
          set -euo pipefail
          classifier="${RUNNER_TEMP}/data_only.py"
          if git show HEAD^1:tools/data_only.py > "$classifier"; then
            python3 -B -I "$classifier" classify
          else
            echo "::notice::The base commit has no classifier; this pull request counts as code."
            printf 'data_only=false\nboot_test=true\n' >> "$GITHUB_OUTPUT"
          fi

  data-only:
    needs: changes
    if: needs.changes.outputs.data_only == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install the validator
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --only-binary :all: --require-hashes --no-deps -r tools/requirements-test.txt

      - name: Validate data/builds.json against its schema
        run: '"$RUNNER_TEMP/venv/bin/python" -B tools/data_only.py validate'

  build:
    name: Build, test, package
    runs-on: windows-2025
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    env:
      PYTHONUTF8: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the version
        id: version
        shell: python
        run: |
          import os, re, sys

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          with open("CMakeLists.txt", encoding="utf-8") as f:
              match = re.search(r"VERSION (\d+\.\d+\.\d+)", f.read())
          if not match:
              fail("no project VERSION found in CMakeLists.txt")
          version = match.group(1)
          ref_name = os.environ.get("GITHUB_REF_NAME", "")
          if os.environ.get("GITHUB_REF_TYPE") == "tag" and not (ref_name == "v" + version or ref_name.startswith("v" + version + "-")):
              fail(f"tag {ref_name} does not match CMakeLists.txt version {version}")
          print(f"version {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"version={version}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"VERSION={version}\n")

      - name: Install the test dependencies
        shell: python
        run: |
          import os, pathlib, subprocess, sys

          subprocess.run([sys.executable, "-m", "pip", "install", "--require-hashes", "--no-deps", "-r", "tools/requirements-test.txt"], check=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"PYTHON_EXE={pathlib.Path(sys.executable).as_posix()}\n")

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Configure
        shell: cmd
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPython3_EXECUTABLE=%PYTHON_EXE%

      - name: Build
        shell: cmd
        run: cmake --build build

      - name: Test
        shell: cmd
        run: ctest --test-dir build --output-on-failure --no-tests=error

      - name: Keep the fault gate for the Wine job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fault-gate
          path: |
            build/fault_gate.exe
            build/fault_gate_mod.dll
          if-no-files-found: error
          retention-days: 1

      - name: Package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = $env:VERSION
          $stage = 'dist\stage'; Remove-Item $stage -Recurse -Force -ErrorAction SilentlyContinue; New-Item -ItemType Directory $stage | Out-Null
          Copy-Item build\iphlpapi.dll, package\README.txt, LICENSE, THIRD_PARTY_NOTICES.md $stage
          New-Item -ItemType Directory "$stage\livemap" | Out-Null
          Copy-Item web\index.html, web\maps.json, web\pois.json, web\pois.json.gz, web\weather.json, web\weather.json.gz, web\shroud.png "$stage\livemap"
          Copy-Item web\icons, web\tiles, web\ui, web\fonts "$stage\livemap" -Recurse
          $zip = "dist\EnshroudedLiveMap-$v.zip"; Remove-Item $zip -ErrorAction SilentlyContinue
          & "$env:SystemRoot\System32\tar.exe" -a -c -f $zip -C $stage iphlpapi.dll livemap README.txt LICENSE THIRD_PARTY_NOTICES.md; if ($LASTEXITCODE) { throw 'tar failed' }
          Remove-Item $stage -Recurse -Force
          Write-Output "$zip"; Get-FileHash build\iphlpapi.dll -Algorithm SHA256 | ForEach-Object { 'iphlpapi.dll sha256 ' + $_.Hash.ToLower() }

      - name: Compare the package with upstream 1.7.0
        shell: python
        run: |
          import hashlib, io, os, sys, urllib.request, zipfile

          UPSTREAM_URL = "https://github.com/oggii/enshrouded-livemap/releases/download/v1.7.0/EnshroudedLiveMap-1.7.0.zip"
          UPSTREAM_SHA256 = "edb1c346b3d245307239de8b2561713c04d2b49170011b98f3e718c760d325b9"
          DLL = "iphlpapi.dll"
          # Upstream's files after the repo's whitespace and markdown lint fixes; any other edit changes the digest.
          LINTED = {
              "THIRD_PARTY_NOTICES.md": "9abe1e7c81cd580ccf027a41b1ce5787458f342b8f7336ce54bea7016a83b803",
              "livemap/pois.json": "00923cfe8befed0c799cc9dec28f83595d67dd8f5931fee5a7c1295fa6b2fcb6",
              "livemap/weather.json": "456705c74c348184a6db0ae7966913708ccfa94eeba062df535ff45b50e06858",
              "livemap/fonts/OFL.txt": "ad9c189d8fe80860a6508268d1427d2cd0fec35982f89e935f292077378c7221",
          }

          def fail(message):
              print(f"::error::{message}")
              sys.exit(1)

          def read_files(archive, label):
              files = {}
              for name in archive.namelist():
                  if name.endswith("/"):
                      continue
                  if name.startswith("/") or ".." in name.split("/"):
                      fail(f"{label}: unsafe entry name {name!r}")
                  if name in files:
                      fail(f"{label}: duplicate entry {name!r}")
                  files[name] = archive.read(name)
              return files

          with urllib.request.urlopen(UPSTREAM_URL, timeout=300) as response:
              blob = response.read()
          digest = hashlib.sha256(blob).hexdigest()
          if digest != UPSTREAM_SHA256:
              fail(f"upstream 1.7.0 zip sha256 is {digest}, expected {UPSTREAM_SHA256}")

          with zipfile.ZipFile(io.BytesIO(blob)) as archive:
              upstream = read_files(archive, "upstream")
          with zipfile.ZipFile(os.path.join("dist", f"EnshroudedLiveMap-{os.environ['VERSION']}.zip")) as archive:
              built = read_files(archive, "built")

          if set(built) != set(upstream):
              for name in sorted(set(upstream) - set(built)):
                  print(f"::error::missing from the built zip: {name}")
              for name in sorted(set(built) - set(upstream)):
                  print(f"::error::not in upstream's zip: {name}")
              fail("the built zip's file list differs from upstream's 1.7.0 zip")
          if not built[DLL]:
              fail(f"{DLL} is empty")

          different = [n for n in sorted(built) if n != DLL and n not in LINTED and built[n] != upstream[n]]
          for name in different:
              print(f"::error::differs from upstream's zip: {name}")
          unpinned = [n for n, pin in LINTED.items() if hashlib.sha256(built[n]).hexdigest() != pin]
          for name in unpinned:
              print(f"::error::does not match its pinned digest: {name}")
          if different or unpinned:
              fail(f"{len(different)} non-DLL files are not byte-identical to upstream's 1.7.0 zip, {len(unpinned)} linted files differ from their pins")
          identical = len(built) - 1 - len(LINTED)
          print(f"file list equals upstream's 1.7.0 zip ({len(built)} files); {identical} non-DLL files are byte-identical, {len(LINTED)} match their pinned digests")

      - name: Check the hook sites against the exe store
        if: github.repository == 'anthony-spruyt/enshrouded-livemap'
        shell: cmd
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"%PYTHON_EXE%" -B tools\hook_check.py'

      - name: Upload the zip
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: EnshroudedLiveMap-${{ steps.version.outputs.version }}
          path: dist/EnshroudedLiveMap-${{ steps.version.outputs.version }}.zip
          if-no-files-found: error

      - name: Delete the server executable
        if: always()
        shell: python
        run: |
          import os, pathlib, shutil

          work = pathlib.Path(os.environ["RUNNER_TEMP"]) / "exe-hook-check"
          shutil.rmtree(work, ignore_errors=True)
          print("exe-hook-check directory removed" if not work.exists() else "::warning::exe-hook-check directory could not be removed")

  compat:
    name: Build and test the compat tool
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure
        run: cmake -S tools/compat -B build/compat -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/compat --parallel

      - name: Test
        run: ctest --test-dir build/compat --output-on-failure --no-tests=error

      - name: Stage the binary
        run: |
          set -euo pipefail
          mkdir dist
          cp build/compat/livemap_compat dist/livemap-compat-linux-x64
          file dist/livemap-compat-linux-x64 | grep -Eq "statically linked|static-pie linked"

      - name: Upload the binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: livemap-compat-linux-x64
          path: dist/livemap-compat-linux-x64
          if-no-files-found: error
          retention-days: 7

  fault-gate-wine:
    name: Fault line under Wine
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FAULT_GATE_EXE: ${{ github.workspace }}/fault-gate/fault_gate.exe
      FAULT_GATE_RUNNER: /usr/lib/wine/wine64
      WINEDEBUG: "-all"
      WINEDLLOVERRIDES: mscoree,mshtml=
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the fault gate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: fault-gate
          path: fault-gate

      - name: Install Wine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wine64

      - name: Install the test dependencies
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install --only-binary :all: --require-hashes --no-deps -r tools/requirements-test.txt

      - name: Create the Wine prefix
        run: timeout 120 "$FAULT_GATE_RUNNER" wineboot --init

      - name: Test the fault line and the tools
        run: '"$RUNNER_TEMP/venv/bin/python" -B -m pytest -q -p no:cacheprovider tools/test_fault_gate.py tools/test_data_only.py tools/test_boot_test.py tools/test_compat_workflow.py'

  boot-test:
    name: Boot the server with the DLL
    needs: [build, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.boot_test == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      # renovate: datasource=docker depName=mornedhels/enshrouded-server
      BOOT_TEST_IMAGE: "mornedhels/enshrouded-server:1.8.1-wine@sha256:002a8ac3387eddc5151b18ab5e7c02f9382f8e941dcfc75e56fa5134bd18f283"
      APP_ID: "2278520"
      DEPOTDOWNLOADER_URL: https://github.com/SteamRE/DepotDownloader/releases/download/DepotDownloader_3.4.0/DepotDownloader-linux-x64.zip
      DEPOTDOWNLOADER_SHA256: a999dec66b4850fc961bd50366696d23c2d0fad7b18790e6a5647b2f19097a53
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Read the depot to download
        id: depot
        run: |
          set -euo pipefail
          echo "WORK=${RUNNER_TEMP}/boot" >> "$GITHUB_ENV"
          python3 -B tools/boot_test.py depot

      - name: Download the built DLL
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EnshroudedLiveMap-${{ needs.build.outputs.version }}
          path: dist

      - name: Unpack the DLL
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p "${WORK}/package"
          unzip -q "dist/EnshroudedLiveMap-${VERSION}.zip" iphlpapi.dll 'livemap/*' -d "${WORK}/package"

      - name: Fetch DepotDownloader
        run: |
          set -euo pipefail
          mkdir -p "${WORK}/tools"
          curl --proto '=https' --proto-redir '=https' -fsSL --retry 3 -o "${WORK}/tools/dd.zip" "$DEPOTDOWNLOADER_URL"
          echo "${DEPOTDOWNLOADER_SHA256}  ${WORK}/tools/dd.zip" | sha256sum --check --status \
            || { echo "::error::The DepotDownloader zip does not match its pinned sha256."; exit 1; }
          unzip -q -o "${WORK}/tools/dd.zip" DepotDownloader -d "${WORK}/tools"
          chmod u+x "${WORK}/tools/DepotDownloader"

      - name: Download the server Steam serves now
        env:
          DEPOT_ID: ${{ steps.depot.outputs.depot }}
        run: |
          set -euo pipefail
          server="${WORK}/enshrouded/server"
          log="${WORK}/depotdownloader.log"
          mkdir -p "$server"
          timeout 900 "${WORK}/tools/DepotDownloader" -app "$APP_ID" -depot "$DEPOT_ID" -dir "$server" > "$log" 2>&1 \
            || { echo "::error::The anonymous Steam download of depot ${DEPOT_ID} failed."; exit 1; }
          timeout 300 "${WORK}/tools/DepotDownloader" -app 1007 -depot 1004 -dir "$server" >> "$log" 2>&1 \
            || { echo "::error::The anonymous Steam download of the Steamworks redistributables failed."; exit 1; }
          echo "downloaded $(du -sh "$server" | cut -f1)"

      - name: Find the row of the downloaded build
        run: python3 -B tools/boot_test.py verify-exe "${WORK}/enshrouded/server"

      - name: Boot the server without and with the DLL
        run: python3 -B tools/boot_test.py run "$WORK" "${WORK}/package"

      - name: Remove the containers and the game files
        if: always()
        run: |
          docker rm -f boot-test-baseline boot-test-livemap > /dev/null 2>&1 || true
          if [[ -n "${WORK:-}" ]]; then rm -rf "$WORK"; fi
          echo "boot test containers and work directory removed"
