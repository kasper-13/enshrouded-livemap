name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

jobs:
  build:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/ci-repo.yaml

  release:
    name: Attest and publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Download the zip
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: EnshroudedLiveMap-${{ needs.build.outputs.version }}
          path: dist

      - name: Download the compat tool
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: livemap-compat-linux-x64
          path: dist

      - name: Write the checksums
        working-directory: dist
        run: |
          set -euo pipefail
          for file in "EnshroudedLiveMap-${VERSION}.zip" livemap-compat-linux-x64; do
            test -f "$file"
            sha256sum "$file" > "$file.sha256"
            line=$(cat "$file.sha256")
            [[ "${line:0:64}" =~ ^[0-9a-f]{64}$ ]]
            [ "${line:64:2}" = "  " ]
            [ "${line:66}" = "$file" ]
            sha256sum --check "$file.sha256"
          done

      - name: Attest the build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/EnshroudedLiveMap-${{ needs.build.outputs.version }}.zip
            dist/livemap-compat-linux-x64

      - name: Publish release
        working-directory: dist
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TOOL: livemap-compat-linux-x64
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/release-notes.md"
          printf 'Automated build of this fork of oggii/enshrouded-livemap. The Enshrouded server builds this release supports are listed in https://github.com/%s/blob/%s/README.md.\n\n' "$GH_REPO" "$TAG" > "$notes"
          printf 'Verify the download with `sha256sum --check EnshroudedLiveMap-%s.zip.sha256` or `gh attestation verify EnshroudedLiveMap-%s.zip --repo %s --signer-workflow %s/.github/workflows/release.yaml --source-ref refs/tags/%s`.\n\n' "$VERSION" "$VERSION" "$GH_REPO" "$GH_REPO" "$TAG" >> "$notes"
          printf 'HD map users: use upstream'\''s 1.7.0 HD map asset.\n\n' >> "$notes"
          printf '`%s` is the Linux build of the compat tool that checks a new server build against the supported ones. Verify it with `sha256sum --check %s.sha256` or `gh attestation verify %s --repo %s --signer-workflow %s/.github/workflows/release.yaml --source-ref refs/tags/%s`. The licenses of the code linked into it are in https://github.com/%s/blob/%s/tools/compat/THIRD_PARTY_NOTICES.md.\n' "$TOOL" "$TOOL" "$TOOL" "$GH_REPO" "$GH_REPO" "$TAG" "$GH_REPO" "$TAG" >> "$notes"

          prerelease_opt=()
          if [[ "$TAG" =~ -(alpha|beta|rc) ]]; then
            prerelease_opt=("--prerelease")
          fi

          if gh release view "$TAG" --repo "$GH_REPO" > /dev/null 2>&1; then
            echo "Release $TAG exists, uploading files..."
            gh release upload "$TAG" --repo "$GH_REPO" --clobber \
              "EnshroudedLiveMap-${VERSION}.zip" \
              "EnshroudedLiveMap-${VERSION}.zip.sha256" \
              "$TOOL" \
              "$TOOL.sha256"
          else
            gh release create "$TAG" \
              --repo "$GH_REPO" \
              --title "$TAG" \
              --notes-file "$notes" \
              "${prerelease_opt[@]}" \
              "EnshroudedLiveMap-${VERSION}.zip" \
              "EnshroudedLiveMap-${VERSION}.zip.sha256" \
              "$TOOL" \
              "$TOOL.sha256"
          fi
